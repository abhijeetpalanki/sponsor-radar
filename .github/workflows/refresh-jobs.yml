name: Refresh jobs

# Pulls open roles from the public job boards every night and commits
# data/jobs.json only when a role changed. Netlify deploys from main, so a
# commit here is what publishes the new roles.
on:
  schedule:
    - cron: "23 9 * * *" # 09:23 UTC, about 4-5 AM in Atlanta. Off the hour, when GitHub's queue is busiest.
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-jobs
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Fetch job boards
        run: npm run data:jobs

      - name: Run tests against the new data
        run: npm test

      - name: Commit if roles changed
        run: |
          if git diff --quiet -- data/jobs.json; then
            echo "No role changes, nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add data/jobs.json
          git commit -m "Refresh jobs $(date -u +%Y-%m-%d)"
          git push
